name: Weekly event refresh
on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weekly-event-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck published organiser listings
        run: python scripts/weekly_event_refresh.py
      - name: Test refresh engine
        run: python -m unittest discover -s scripts -p 'test_weekly_event_refresh.py'
      - name: Build iCloud subscription feed
        run: python scripts/build_calendar_feed.py
      - name: Validate app data
        run: npm --prefix fighteye_v195_v196 run check
      - name: Publish verified updates
        run: |
          if ! git diff --quiet -- fighteye_v195_v196/data/events-api.json fighteye_v195_v196/data/events.js fighteye_v195_v196/data/events.ics; then
            git config user.name 'FightEye event bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add fighteye_v195_v196/data/events-api.json fighteye_v195_v196/data/events.js fighteye_v195_v196/data/events.ics
            git commit -m 'Refresh verified event dates'
            git push
          fi
